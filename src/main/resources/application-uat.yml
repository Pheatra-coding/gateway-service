server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    web-application-type: reactive

  cloud:
    gateway:

      httpclient:
        connect-timeout: ${CONNECTION_TIMEOUT:5000}
        response-timeout: ${RESPONSE_TIMEOUT:15s}
        pool:
          type: elastic
          max-idle-time: 30s
          max-life-time: 60s

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5174"
              - "http://10.0.213.20:30001"
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # ===========================
        # AUTH SERVICE
        # ===========================
        - id: apd-auth-service
          uri: ${AUTH_URI:lb://APD-AUTH-SERVICE}
          predicates:
            - Path=/api/${api.ems_version}/auth/**,
              /api/${api.ems_version}/login/**,
              /api/${api.ems_version}/refresh/**
          filters:
            - StripPrefix=0

        # ===========================
        # USER SERVICE
        # ===========================
        - id: apd-userservice
          uri: ${USER_URI:lb://APD-USERSERVICE}
          predicates:
            - Path=/api/${api.ems_version}/user/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

            - name: Retry
              args:
                retries: 2
                methods: GET,POST
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user

        # ===========================
        # EMPLOYEE SERVICE
        # ===========================
        - id: apd-employee-service
          uri: ${EMPLOYEE_URI:lb://APD-EMPLOYEE-SERVICE}
          predicates:
            - Path=/api/${api.ems_version}/employee/**,
              /api/${api.ems_version}/hr/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

            - name: Retry
              args:
                retries: 2
                methods: GET,POST
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

            - name: CircuitBreaker
              args:
                name: employeeServiceCB
                fallbackUri: forward:/fallback/employee

        # ===========================
        # E-LEARNING SERVICE
        # ===========================
        - id: apd-elearning
          uri: ${ELEARNING_URI:lb://APD-ELEARNING}
          predicates:
            - Path=/api/${api.ems_version}/courses/**,
              /api/${api.ems_version}/learning/**,
              /api/${api.ems_version}/files/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

            - name: Retry
              args:
                retries: 2
                methods: GET,POST
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

            - name: CircuitBreaker
              args:
                name: elearningCB
                fallbackUri: forward:/fallback/elearning

        # ===========================
        # FILE SERVICE
        # ===========================
        - id: apd-file-service
          uri: ${FILE_URI:lb://APD-FILE-SERVICE}
          predicates:
            - Path=/api/${api.ems_version}/files/**,
              /api/${api.ems_version}/upload/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

            - name: Retry
              args:
                retries: 2
                methods: GET,POST
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

            - name: CircuitBreaker
              args:
                name: fileServiceCB
                fallbackUri: forward:/fallback/file

        # ===========================
        # SWAGGER ROUTES
        # ===========================
        - id: auth-swagger
          uri: ${AUTH_URI:lb://APD-AUTH-SERVICE}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth,/v3/api-docs

        - id: user-swagger
          uri: ${USER_URI:lb://APD-USERSERVICE}
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user,/v3/api-docs

        - id: employee-swagger
          uri: ${EMPLOYEE_URI:lb://APD-EMPLOYEE-SERVICE}
          predicates:
            - Path=/v3/api-docs/employee
          filters:
            - RewritePath=/v3/api-docs/employee,/v3/api-docs

        - id: elearning-swagger
          uri: ${ELEARNING_URI:lb://APD-ELEARNING}
          predicates:
            - Path=/v3/api-docs/elearning
          filters:
            - RewritePath=/v3/api-docs/elearning,/v3/api-docs